<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Pin-Pin</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game" width="640" height="360"></canvas>

  <!-- gumbi na dotik: vidni samo na napravah z zaslonom na dotik -->
  <div id="touch-controls">
    <div class="touch-side touch-left">
      <div class="touch-btn touch-round touch-jump" data-action="jump">Skok</div>
      <div class="touch-btn touch-round touch-throw" data-action="throw">Kepa</div>
    </div>
    <div class="touch-side touch-right">
      <div class="touch-dpad">
        <div class="touch-btn dpad-up" data-action="up">&#9650;</div>
        <div class="touch-btn dpad-left" data-action="left">&#9664;</div>
        <div class="touch-btn dpad-right" data-action="right">&#9654;</div>
        <div class="touch-btn dpad-down" data-action="down">&#9660;</div>
      </div>
    </div>
  </div>

  <script src="js/pinpin.js"></script>

  <script src="js/config/settings.js"></script>
  <script src="js/config/controls.js"></script>
  <script src="js/config/animations.js"></script>
  <script src="js/config/sprites.js"></script>
  <script src="js/config/rooms/room-1.js"></script>

  <script src="js/core/math.js"></script>
  <script src="js/core/actions.js"></script>
  <script src="js/core/loop.js"></script>
  <script src="js/core/room.js"></script>
  <script src="js/core/physics.js"></script>
  <script src="js/core/player.js"></script>
  <script src="js/core/energy.js"></script>
  <script src="js/core/camera.js"></script>
  <script src="js/core/snowballs.js"></script>
  <script src="js/core/animals.js"></script>
  <script src="js/core/game.js"></script>

  <script src="js/platform/keyboard.js"></script>
  <script src="js/platform/gamepad.js"></script>
  <script src="js/platform/touch.js"></script>
  <script src="js/platform/input.js"></script>
  <script src="js/platform/images.js"></script>
  <script src="js/platform/screen.js"></script>

  <script src="js/render/background.js"></script>
  <script src="js/render/tiles.js"></script>
  <script src="js/render/sprites.js"></script>
  <script src="js/render/snowballs.js"></script>
  <script src="js/render/animals.js"></script>
  <script src="js/render/hud.js"></script>
  <script src="js/render/overlay.js"></script>
  <script src="js/render/renderer.js"></script>

  <script src="js/app/main.js"></script>
</body>
</html>
